<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORE {{VERSION}} — カードバランス実測</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#e5ebf4;font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:36px 28px}h1{font-size:30px;letter-spacing:.03em;margin:8px 0}p{color:#acbdd2}.eyebrow{color:#86c9f5;font-size:13px;letter-spacing:.1em}.stats{display:flex;gap:32px;flex-wrap:wrap;margin:24px 0}.stats strong{font-size:26px;display:block}.stats span{color:#acbdd2;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #344154;padding:0 0 18px}button,input,select{font:inherit;color:inherit;background:#182536;border:1px solid #475870;border-radius:6px;padding:8px 14px}button{cursor:pointer}button[aria-selected=true]{background:#d4ebfd;color:#10283b;border-color:#d4ebfd}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #caa469;outline-offset:2px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:20px 0}.controls input{width:300px;max-width:100%}a{color:#9fd3f6}.scroll{overflow:auto;max-height:70vh}table{border-collapse:collapse;width:100%;font-size:14px}th{background:#1b2a3e;position:sticky;top:0;z-index:1;text-align:left;white-space:nowrap;cursor:pointer}th,td{padding:10px 12px;border-bottom:1px solid #2d3b4e}td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tbody tr:hover{background:#1e2d41}.muted{color:#95a6bb;font-size:12px}.positive{color:#8fdbb7}.negative{color:#f0a99e}.note{max-width:1100px;min-height:52px}details{max-width:430px}summary{cursor:pointer}footer{margin-top:24px;color:#95a6bb;font-size:12px}@media(max-width:600px){main{padding:20px 14px}h1{font-size:23px}.stats{gap:18px}}
</style>
<main><div class="eyebrow">LORE / BALANCE LAB / {{VERSION}} / 2026.09.10</div><h1>カードバランス実測</h1><p>通常プール・スターター・組み合わせ・構築を、条件の異なる実験で比較。</p><div class="stats" id="stats"></div>
<nav role="tablist" aria-label="集計の種類"><button role="tab" aria-selected="true" data-view="market">全体プール 240</button><button role="tab" aria-selected="false" data-view="starters">スターター 33</button><button role="tab" aria-selected="false" data-view="pairs">組み合わせ観測</button><button role="tab" aria-selected="false" data-view="factor">コンボ比較実験</button><button role="tab" aria-selected="false" data-view="builds">構築別</button><button role="tab" aria-selected="false" data-view="quests">クエスト達成</button></nav>
<div class="controls"><label>カード名・ID <input id="query" placeholder="例：世界樹、RIFT" aria-label="カード名またはIDで検索"></label><label id="minwrap" hidden>最低試行数 <select id="minn"><option value="1">1（参考）</option><option>30</option><option selected>150</option><option>500</option></select></label><span id="count" class="muted" aria-live="polite"></span></div>
<p class="note" id="note"></p><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
<footer>勝率＝勝ち1・引き分け0.5。未決着は除外。CIは95%信頼区間。列名をクリックすると並べ替え。<br><a href="REPORT.md">分析レポート</a> · <a href="methodology.md">実験条件と限界</a> · <a href="results.json">全集計JSON</a></footer></main>
<script>
const D=/*DATA*/{};
const $=id=>document.getElementById(id),esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>x==null?'—':(100*x).toFixed(1)+'%',pp=x=>x==null?'—':(x>=0?'+':'')+(100*x).toFixed(1)+'pt';
let view='market',sortKey='mean',direction=-1;
$('stats').innerHTML=[['実行対戦',D.summary.attempted.toLocaleString()],['決着',D.summary.finished.toLocaleString()],['未決着除外',D.summary.failed.toLocaleString()],['自然対戦の先手成績',pct(D.summary.firstScore.observe)]].map(([a,b])=>'<div><strong>'+b+'</strong><span>'+a+'</span></div>').join('');
const config={
market:{note:'同コストの無作為なカードを優先購入する相手との比較。双方が通常コストを支払い、初期8枚は同一。値は購入方針の価値であり、専用構築や人間の最適プレイの順位ではありません。',cols:[['name','カード'],['cost','コスト'],['mean','比較勝率',pct],['lo','95% CI',(_,x)=>pct(x.lo)+'–'+pct(x.hi)],['games','試合数'],['boughtRate','購入率',pct],['usedRate','使用率',pct],['excludedGames','除外数'],['flags','評価の注意点',v=>(v??[]).join(' / ')||'—']]},
starters:{note:'カル1枠を対象カードに変えたときの勝率差。背景デッキ・相手・シード・先後を揃えています。未使用カードの差は、デッキへの混入やBOTの評価への影響を含み、効力の順位ではありません。アチューンは固定1枚のため順位なし。',cols:[['name','カード'],['mean','カル比',pp],['lo','95% CI',(_,x)=>pp(x.lo)+'〜'+pp(x.hi)],['treatmentScore','置換後勝率',pct],['controlScore','対照勝率',pct],['n','シード数'],['observedUses','自然対戦使用回数'],['flags','評価の注意点',v=>(v??[]).join(' / ')||'—']]},
pairs:{note:'初期採用または通常購入した2枚が揃った側の観測勝率。優勢だから購入できた等の偏りを含み、コンボの因果効果ではありません。序盤＝双方合計10ターン以内。最大500行を表示し、全件はJSONに保存。',cols:[['nameA','カードA'],['nameB','カードB'],['score','同時保有勝率',pct],['n','試行数'],['aOnly','Aのみ',pct],['bOnly','Bのみ',pct],['earlyScore','序盤保有勝率',pct],['earlyN','序盤n']]},
factor:{note:'00=両方対照、10=Aのみ、01=Bのみ、11=両方。相互作用=11−10−01+00。単体の強さを越えた上乗せを測る優先購入/スターター置換の実験です。',cols:[['combo','組み合わせ',(v,x)=>v.split('|').map(id=>D.names[id]).join(' + ')+(x.support?'（共通補助：'+D.names[x.support]+'）':'')],['arms','00',v=>pct(v['00'])],['arm10','10',(_,x)=>pct(x.arms['10'])],['arm01','01',(_,x)=>pct(x.arms['01'])],['arm11','11',(_,x)=>pct(x.arms['11'])],['mean','相互作用',pp],['lo','95% CI',(_,x)=>pp(x.lo)+'〜'+pp(x.hi)],['n','シード数']]},
builds:{note:'初期構築16種の総当たり。各対戦相手60戦を予定した固定レシピの成績で、最適構築の探索結果ではありません。「選ばれし領域」をBOTが即勝利盤面で使わない問題は別途再現済みです。',cols:[['build','構築',v=>D.buildLabels[v]??v],['mean','勝率',pct],['games','試合数'],['turn','平均ターン',v=>v.toFixed(1)],['turncap','60T到達率',pct],['maxHp','終了時最大HP',v=>v.toFixed(1)]]},
quests:{note:'自然対戦で配置した側のうち、1回以上達成した割合。配置前の行動は条件に加算されません。対戦の長さとBOTの構築・行動方針に依存します。',cols:[['id','クエスト',v=>D.names[v]],['activated','配置n'],['complete','達成n'],['rate','達成率',pct]]}
};
function render(){const cfg=config[view],q=$('query').value.toLowerCase();$('note').textContent=cfg.note;$('minwrap').hidden=view!=='pairs';
 let rows=D[view].map(x=>view==='quests'?{...x,rate:x.complete/x.activated}:x).filter(x=>(JSON.stringify(x)+' '+(D.names[x.id]??'')+' '+(x.combo??'').split('|').map(id=>D.names[id]??id).join(' ')+' '+(D.buildLabels[x.build]??'')).toLowerCase().includes(q)&&(view!=='pairs'||x.n>=Number($('minn').value)));
 const val=(x,k)=>k==='combo'?x.combo:k==='arm10'?x.arms['10']:k==='arm01'?x.arms['01']:k==='arm11'?x.arms['11']:k==='arms'?x.arms['00']:x[k];
 rows.sort((a,b)=>{let av=val(a,sortKey),bv=val(b,sortKey);return typeof av==='string'?direction*av.localeCompare(bv):direction*((av??-Infinity)-(bv??-Infinity));});
 $('count').textContent=rows.length+'件'+(rows.length>500?' / 先頭500件表示':'');
 $('head').innerHTML='<tr>'+cfg.cols.map(([key,title])=>'<th scope="col" tabindex="0" data-sort="'+key+'">'+esc(title)+(sortKey===key?(direction<0?' ↓':' ↑'):'')+'</th>').join('')+'</tr>';
 $('rows').innerHTML=rows.slice(0,500).map(x=>'<tr>'+cfg.cols.map(([key,title,fmt],i)=>{const value=fmt?fmt(x[key],x):x[key];let cell=esc(value);if(key==='name')cell='<details><summary>'+esc(x.name)+'</summary><div class="muted">'+esc(x.id)+'<br>'+esc(x.text)+'</div></details>';return '<td class="'+(i===0||key.startsWith('name')?'':'num')+'">'+cell+'</td>';}).join('')+'</tr>').join('');
 $('head').querySelectorAll('th').forEach(th=>{const action=()=>{direction=sortKey===th.dataset.sort?-direction:-1;sortKey=th.dataset.sort;render();};th.onclick=action;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action();}};});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;sortKey=view==='pairs'?'score':view==='quests'?'rate':'mean';direction=-1;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render();});
$('query').oninput=render;$('minn').onchange=render;render();
</script></html>
