name = "lore-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- Custom domain: yourlore.xyz (zone on the same CF account).
#     `wrangler deploy` provisions DNS + TLS automatically. ---
routes = [
  { pattern = "yourlore.xyz", custom_domain = true },
  { pattern = "www.yourlore.xyz", custom_domain = true },
  # isolated admin origin — separate browser origin ⇒ game-site XSS can't touch the admin session
  { pattern = "admin.yourlore.xyz", custom_domain = true },
]

# --- Static Assets: serve the built client from the SAME origin as the API,
#     so cookies + relative /api and /ws calls just work (no CORS/cookie pain). ---
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- Durable Objects: SQLite-backed (required on the Workers FREE plan) ---
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "GameRoom"]

# --- D1: users / sessions / match records ---
[[d1_databases]]
binding = "DB"
database_name = "lore-db"
database_id = "050d409e-913f-4a07-92b8-0d150ee6ce4d"

# AUTH_SECRET / GOOGLE_CLIENT_SECRET are set via `wrangler secret put <NAME>`
[vars]
APP_ORIGIN = "*"
GOOGLE_CLIENT_ID = "955911680552-9i1tcrojam3v759dmampaga63d387gvt.apps.googleusercontent.com"
ADMIN_EMAILS = "maruru836818@gmail.com,suhwoo3@gmail.com"

# ============================================================================
# STAGING — test.yourlore.xyz. Fully isolated from prod: its own worker,
# its own Durable Objects, its own D1 (lore-db-staging). Deploy with:
#   npm run deploy:staging   (= wrangler deploy -c server/wrangler.toml --env staging)
# ============================================================================
[env.staging]
name = "lore-server-staging"
routes = [
  { pattern = "test.yourlore.xyz", custom_domain = true },
]

[env.staging.assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.staging.durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[env.staging.durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "GameRoom"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lore-db-staging"
database_id = "a7dfa4cf-2d90-4a9e-a9e1-2e69dcc4ddea"

[env.staging.vars]
APP_ORIGIN = "*"
MATCH_TEST_BOTS = "1"
GOOGLE_CLIENT_ID = "955911680552-9i1tcrojam3v759dmampaga63d387gvt.apps.googleusercontent.com"
ADMIN_EMAILS = "maruru836818@gmail.com,suhwoo3@gmail.com"

# Separate namespaces prevent production/staging sharing abuse counters.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "926093001"
simple = { limit = 30, period = 60 }
[[ratelimits]]
name = "INQUIRY_RATE_LIMITER"
namespace_id = "926093002"
simple = { limit = 5, period = 60 }
[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "926093003"
simple = { limit = 30, period = 60 }
[[env.staging.ratelimits]]
name = "INQUIRY_RATE_LIMITER"
namespace_id = "926093004"
simple = { limit = 5, period = 60 }
[observability]
enabled = true
head_sampling_rate = 1
[env.staging.observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
[env.staging.observability.logs]
invocation_logs = false
