<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORE — メニュー改善 15案</title><style>
*{box-sizing:border-box}body{margin:0;background:#09121d;color:#dce6ee;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #c3e7fa;outline-offset:3px}header{padding:24px 32px 20px;border-bottom:1px solid #314354;display:flex;align-items:center;justify-content:space-between}header small{font-size:9px;letter-spacing:.24em;color:#9bb2c5}h1{font-size:23px;font-weight:400;margin:8px 0 0}header>span{font-size:10px;color:#b4c8d6;border:1px solid #506776;padding:8px 12px;border-radius:20px}main{padding:24px 32px 40px;max-width:1700px;margin:auto}.groups{display:flex;gap:8px;margin-bottom:22px}.groups button{background:none;border:1px solid #344b5e;color:#a9bdcd;border-radius:5px;padding:11px 20px;font-size:12px}.groups button[aria-pressed=true]{background:#cadfe9;color:#10283a;border-color:#cadfe9}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:25px}.issue{font-size:11px;line-height:1.85;color:#94aabf;margin:0 0 15px}.choices{display:grid;gap:7px}.choice{display:grid;grid-template-columns:27px 1fr;text-align:left;gap:5px 6px;padding:15px 12px;background:#101e2c;border:1px solid #2c4254;border-radius:6px;color:#c4d6e3}.choice b{font-size:13px;font-weight:500}.choice span{font:19px Georgia;color:#a3bace;grid-row:1/3}.choice small{grid-column:2;font-size:10px;color:#8ca6bb;line-height:1.7}.choice[aria-pressed=true]{background:#20384a;border-color:#bbd9e9;box-shadow:inset 3px 0 #c8e1ec}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.tools button,.tools a{background:none;border:1px solid #344b5e;color:#a9bdcd;border-radius:4px;padding:8px 11px;font-size:10px;text-decoration:none}.tools button[aria-pressed=true]{background:#d9e7ed;color:#122d40}.tools a{margin-left:auto}.stage{height:590px;width:100%;display:flex;align-items:center;justify-content:center;background:#06101a;border:1px solid #304758;border-radius:7px;overflow:hidden}.frame-wrap{position:relative;flex:none}.frame-wrap iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left}.description{margin:12px 0 0;color:#a9bfce;font-size:12px;line-height:1.8}.hint{font-size:10px;line-height:1.8;color:#7f9baf}.reference{font-size:11px;color:#9dbacc;line-height:1.9;margin-top:24px;border-top:1px solid #2d4355;padding-top:18px}.reference a{color:#c0d9e8}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.mini{background:#101f2d;border:1px solid #2e4558;border-radius:6px;overflow:hidden}.mini>button{display:flex;gap:14px;background:none;border:0;border-bottom:1px solid #2e4558;width:100%;color:#c9dce7;text-align:left;padding:12px;font-size:12px}.mini>button small{color:#839fb2;font-size:10px}.mini-stage{position:relative;overflow:hidden;width:100%;aspect-ratio:16/9}.mini iframe{width:1280px;height:720px;border:0;transform-origin:top left;position:absolute;left:0;top:0}h2{font-size:17px;font-weight:400;margin-top:34px}label{font-size:11px;color:#9fb7c8;display:flex;align-items:center;gap:6px;margin:15px 0}.bundle{font-size:10px;color:#b1c8d7;line-height:1.8;background:#152839;padding:10px;display:none}.bundle.visible{display:block}@media(max-width:850px){header{padding:20px 16px}h1{font-size:19px}main{padding:18px 16px}.groups{gap:6px}.groups button{flex:1;padding:10px 7px;font-size:10px}.layout{grid-template-columns:1fr}.choices{grid-template-columns:1fr 1fr}.choice{padding:10px}.choice b{font-size:11px}.stage{height:570px}.compare{grid-template-columns:1fr}.tools a{margin-left:0}}
</style></head><body><header><div><small>LORE / MENU EVOLUTION — 15 STUDIES</small><h1>下ナビから、画面全体へ。</h1></div><span>LOCAL CONCEPTS</span></header><main><nav class="groups" aria-label="改善する領域"></nav><div class="layout"><aside><p class="issue"></p><div class="choices"></div><label><input id="combine" type="checkbox">選んだ案を組み合わせる</label><div class="bundle"></div><p class="hint">下ナビ①は共通で固定。各領域を単独で比較でき、選択した3案を組み合わせることもできます。</p></aside><section><div class="tools"><button data-size="desktop">PC · 1280</button><button data-size="mobile">スマホ · 390</button><button data-size="small">小画面 · 320</button><button id="rank">ランキング</button><button id="shop">ショップ</button><a id="full" target="_blank" rel="noopener">原寸で開く ↗</a></div><div class="tools"><button id="replay">▶ 入場を再生</button><button id="slow" aria-pressed="false">0.5 × スロー</button><button id="reduce" aria-pressed="false">動きを抑える</button></div><div class="stage"><div class="frame-wrap"><iframe id="scene" title="メニュー改善案のプレビュー"></iframe></div></div><p class="description"></p><p class="hint">モード切替・使用デッキ変更・ランキング行・スリーブを操作できます。すべてサンプルデータで、対戦・購入・保存は行いません。</p></section></div><h2>この領域の5案を比較</h2><section class="compare"></section><div class="reference">制作基準：採用済みの下ナビ①と、<a href="/@fs/Users/hiromaru05s/Desktop/LORE_TCG/docs/menu-design-insights.md" target="_blank">共有設計メモ</a>。ここにある15案はローカルの提案です。ステージングへ反映したのは、採用済みの下ナビ①のみです。</div></main><script type="module">
import {studies} from '/src/dev/menuEvolutionData.ts';
const p=new URLSearchParams(location.search);let group=['header','home','secondary'].includes(p.get('group'))?p.get('group'):'home',choices={header:1,home:1,secondary:1},size='desktop',page='leaderboard',combine=false,slow=false,reduced=false;if(/^[1-5]$/.test(p.get('v')||''))choices[group]=Number(p.get('v'));
const scene=document.querySelector('#scene'),stage=document.querySelector('.stage'),wrap=document.querySelector('.frame-wrap'),compare=document.querySelector('.compare');
function sceneUrl(v,combined=combine){let q=new URLSearchParams({group,v:String(v),page:group==='secondary'?page:'home'});if(combined){q.set('combined','1');q.set('a',choices.header);q.set('b',choices.home);q.set('c',choices.secondary)}return '/menu-evolution-scene.html?'+q}
function settings(){document.querySelectorAll('iframe').forEach(f=>f.contentWindow?.postMessage({type:'evo-settings',slow,reduced},location.origin))}
scene.onload=settings;
function fit(){let [w,h]=size==='desktop'?[1280,720]:size==='mobile'?[390,844]:[320,568],s=Math.min((stage.clientWidth-12)/w,(stage.clientHeight-12)/h,1);wrap.style.width=w*s+'px';wrap.style.height=h*s+'px';scene.style.width=w+'px';scene.style.height=h+'px';scene.style.transform=`scale(${s})`;document.querySelectorAll('.mini-stage').forEach(el=>el.querySelector('iframe').style.transform=`scale(${el.clientWidth/1280})`)}
function refresh(){document.querySelector('.groups').innerHTML=Object.entries(studies).map(([key,val])=>`<button data-group="${key}" aria-pressed="${group===key}">${val.label}</button>`).join('');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;refresh()});document.querySelector('.issue').textContent=studies[group].issue;document.querySelector('.choices').innerHTML=studies[group].variants.map(([name,desc],i)=>`<button class="choice" data-v="${i+1}" aria-pressed="${choices[group]===i+1}"><span>0${i+1}</span><b>${name}</b><small>${desc}</small></button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{choices[group]=Number(b.dataset.v);refresh()});document.querySelector('.description').textContent=studies[group].variants[choices[group]-1][2];scene.src=sceneUrl(choices[group]);document.querySelector('#full').href=scene.src;document.querySelector('#rank').hidden=document.querySelector('#shop').hidden=group!=='secondary';document.querySelector('#rank').setAttribute('aria-pressed',page==='leaderboard');document.querySelector('#shop').setAttribute('aria-pressed',page==='shop');document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===size));document.querySelector('.bundle').classList.toggle('visible',combine);document.querySelector('.bundle').textContent=Object.keys(studies).map(g=>`${g==='header'?'A':g==='home'?'B':'C'}${choices[g]} ${studies[g].variants[choices[g]-1][0]}`).join(' / ');compare.innerHTML=studies[group].variants.map(([name,desc],i)=>`<article class="mini"><button data-mini="${i+1}">0${i+1} / ${name}<small>${desc}</small></button><div class="mini-stage"><iframe loading="lazy" title="${name}" src="${sceneUrl(i+1,false)}"></iframe></div></article>`).join('');compare.querySelectorAll('button').forEach(b=>b.onclick=()=>{choices[group]=Number(b.dataset.mini);refresh();scrollTo({top:0,behavior:'smooth'})});compare.querySelectorAll('iframe').forEach(f=>f.onload=settings);fit();history.replaceState(null,'','?'+new URLSearchParams({group,v:String(choices[group])}))}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;refresh()});document.querySelector('#combine').onchange=e=>{combine=e.target.checked;refresh()};document.querySelector('#rank').onclick=()=>{page='leaderboard';refresh()};document.querySelector('#shop').onclick=()=>{page='shop';refresh()};document.querySelector('#replay').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow?.postMessage({type:'evo-replay'},location.origin));document.querySelector('#slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',slow);settings()};document.querySelector('#reduce').onclick=e=>{reduced=!reduced;e.target.setAttribute('aria-pressed',reduced);settings()};new ResizeObserver(fit).observe(stage);refresh();
</script></body></html>
