<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LORE · 背景の輪郭 比較</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101f32;color:#dae7f4;font:13px system-ui}header{height:48px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px}button{font:inherit;color:inherit;border:1px solid #607589;background:#1c3047;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{background:#325579;border-color:#cedde9}small{color:#9fb4c9}iframe{display:block;border:0;width:100%;height:calc(100dvh - 48px)}@media(max-width:650px){header{height:78px;flex-wrap:wrap;gap:4px}small{width:100%;text-align:center}button{padding:5px 8px}iframe{height:calc(100dvh - 78px)}}</style></head>
<body><header aria-label="背景の比較"><button data-look="balanced" aria-pressed="true">今回 · 75目標</button><button data-look="soft" aria-pressed="false">前回 · 40目標</button><button data-look="original" aria-pressed="false">元の素材 · 100基準</button><small>数値は制作目標・雲は共通</small></header><iframe title="Zenoと背景のプレビュー" src="/balanced-background-scene.html?look=balanced"></iframe>
<script type="module">const frame=document.querySelector('iframe');for(const button of document.querySelectorAll('button'))button.onclick=()=>{for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));frame.src='/balanced-background-scene.html?look='+button.dataset.look;};</script></body></html>
