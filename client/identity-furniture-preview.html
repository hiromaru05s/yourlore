<!doctype html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORE マナ枠とつながる3D銘板</title><style>*{box-sizing:border-box}body{margin:0;background:#14202a;color:#e4dfd0;font:14px system-ui,sans-serif}header{position:sticky;top:0;left:0;z-index:4;background:#14202af5;display:flex;align-items:center;gap:18px;padding:13px 18px;flex-wrap:wrap;border-bottom:1px solid #6d6b5e}h1{font:500 15px system-ui;margin:0}button,select{font:inherit;color:inherit;background:#293741;border:1px solid #7d7b69;border-radius:3px;padding:8px 12px}label{display:flex;align-items:center;gap:8px}p{font-size:12px;color:#b9c2c6;margin:10px 18px}main{overflow:auto;height:calc(100dvh - 110px);min-height:400px}iframe{display:block;width:1920px;height:1080px;border:0}body[data-size=window] iframe{width:100%;height:100%}</style><header><h1>盤面の基準線・ネームタグ・勲章枠</h1><label>表示<select id="size"><option value="1920">1920 × 1080・実寸</option><option value="1280">1280 × 720・実寸</option><option value="window">ウィンドウに合わせる</option></select></label><label><input id="samples" type="checkbox" checked>ランク・勲章の配置例</label><label><input id="guides" type="checkbox">基準線を表示</label></header><p>自分側はキャラクター枠の頂点、相手側は下端に整列。ランク部分はネームタグと同じ角度に折り、ネームタグ・マナ枠へ密着させています。ランク・勲章は配置確認用のサンプルです。</p><main><iframe id="board" title="実盤面プレビュー" src="/identity-furniture-board.html"></iframe></main><script type="module">const frame=document.querySelector('#board');document.querySelector('#size').onchange=e=>{document.body.dataset.size=e.target.value;if(e.target.value==='window'){frame.style.removeProperty('width');frame.style.removeProperty('height')}else{frame.style.width=(e.target.value==='1280'?1280:1920)+'px';frame.style.height=(e.target.value==='1280'?720:1080)+'px'}};document.querySelector('#samples').onchange=e=>frame.contentWindow.postMessage({type:'identity-samples',show:e.target.checked},location.origin);document.querySelector('#guides').onchange=e=>frame.contentWindow.postMessage({type:'identity-guides',show:e.target.checked},location.origin);</script></html>
