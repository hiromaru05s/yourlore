<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選ばれし領域 — 効果音7案</title></head><body><main><header><div><small>LORE / CROWN SOUND STUDY</small><h1>選ばれし領域 <span>効果音 7案</span></h1></div><p>01「虚空の戴冠」<br>完成の光に合わせて比較</p></header><div id="stage"><iframe id="board" title="実盤面" src="/src/dev/chosen-sound-seven/board.html"></iframe><canvas id="scene" aria-label="選ばれし領域の冠"></canvas><div id="phase">準備中</div></div><section class="player"><div class="current"><b id="title">01 白銀の抜刀</b><span id="desc"></span></div><div class="tools"><select id="mode" aria-label="再生範囲"><option value="impact">完成部分から</option><option value="full">演出を最初から</option><option value="sound">効果音だけ</option></select><button id="replay" disabled>読み込み中</button><button id="stop">停止</button><button id="sequence" disabled>7案を順番に</button><label>音量 <input id="volume" type="range" min="0" max="100" value="70" aria-label="音量"></label></div><div id="choices" aria-label="7つの効果音"></div><p class="hint" id="status">音を準備しています</p></section><footer>番号を押すと再生 · キー 1〜7 でも切替 · 同じ完成時刻、揃えた音量で比較 · 採用：02 重刃の確定</footer></main><script type="module" src="/src/dev/chosen-sound-seven/main.ts"></script></body></html>
