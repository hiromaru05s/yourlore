      <path fill="#d3ccbf" d="M53 501 58 245C60 123 106 64 241 62H881V65H241C112 68 65 128 65 248L59 501Z"/>
      <!-- Broad-to-fine silhouettes; these are ink, not raised metal. -->
      <path fill="#beb19a" d="M63 408C78 334 84 298 115 243C157 169 210 124 296 104C222 135 197 167 177 205C153 251 164 275 142 302C119 329 91 343 63 408Z"/>
