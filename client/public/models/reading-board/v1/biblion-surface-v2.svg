<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1260" viewBox="0 0 2048 1260">
  <title>Biblion — flowing bookbinding border</title>
  <desc>Flat warm ink follows the ivory board perimeter. Tapered quill and leaf forms echo the curved metal frame. The playing field remains open. No central emblem, shading, bevel, grain or relief.</desc>
  <rect width="2048" height="1260" fill="#e7e5df"/>
  <defs>
    <g id="binding-corner">
      <!-- A continuous frame, with the same broad sweep as the physical rim. -->
