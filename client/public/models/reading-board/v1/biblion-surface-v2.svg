      <path fill="#beb19a" d="M148 219C176 153 235 106 323 87C365 78 402 77 448 81C354 89 294 105 250 137C215 162 191 196 148 219Z"/>
      <path fill="#c6baa3" d="M213 160C255 127 318 112 377 119C398 122 418 129 431 142C384 130 355 137 315 155C349 127 303 129 275 138C253 145 234 154 213 160Z"/>
