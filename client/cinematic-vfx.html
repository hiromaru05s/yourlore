<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORE — Battle VFX Study</title></head><body><main id="studio"><header><div class="wordmark">LORE<span>VFX STUDY · 01</span></div><div class="heading"><h1>記録に、力を。</h1><p>ドロー / 召喚 / 攻撃 / 魔法発動</p></div><span class="edition">CINEMATIC BATTLE<br><b>シャドバ品質を目標にした試作</b></span></header><section id="viewport"><iframe title="LORE エフェクト実盤面" src="/cinematic-vfx-scene.html"></iframe><div id="loading">現行の盤面・カードを準備しています…</div><div class="caption"><span id="eyebrow">01 / DRAW</span><h2 id="effect-title">銀光のドロー</h2><p id="description">束から引き抜いた一枚が、銀の光を引いて手札へ。</p></div></section><footer><nav aria-label="演出の種類"><button data-kind="draw" aria-pressed="true"><em>01</em>ドロー<span>DRAW</span></button><button data-kind="summon"><em>02</em>召喚<span>SUMMON</span></button><button data-kind="attack"><em>03</em>攻撃<span>STRIKE</span></button><button data-kind="spell"><em>04</em>魔法発動<span>CAST</span></button></nav><div class="transport"><button id="replay" title="最初から再生">↻ 再生</button><button id="pause">一時停止</button><label><input id="playlist" type="checkbox" checked>4種を順番に</label><label><input id="loop" type="checkbox" checked>連続</label><select id="speed" aria-label="再生速度"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select><select id="mode" aria-label="表示モード"><option value="board">実盤面</option><option value="focus" selected>拡大・暗背景</option><option value="white">拡大・白背景</option></select><select id="side" aria-label="演出する陣営"><option value="0">自分側</option><option value="1">相手側</option></select><button id="sound" aria-pressed="false">音 OFF</button></div><div class="timeline"><span id="phase">準備中</span><input id="seek" type="range" aria-label="再生位置" min="0" max="1000" value="0"><output id="time">0.00 / 2.40s</output></div></footer></main><script type="module" src="/src/dev/cinematic-vfx/studio.ts"></script></body></html>
