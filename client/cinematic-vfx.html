<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORE — Battle VFX Study</title></head><body><main id="studio"><header><div class="wordmark">LORE<span>VFX STUDY · 12</span></div><div class="heading"><h1>マナによる具現化、２つの方向。</h1><p>通常召喚 · カードに沿う細部と、控えめな光</p></div><span class="edition">CINEMATIC BATTLE<br><b>動画リファレンスからの２案</b></span></header><section id="viewport"><iframe id="study-frame" title="LORE 試作エフェクト実盤面" src="/cinematic-vfx-scene.html?controlled"></iframe><iframe id="current-frame" title="LORE 現行エフェクト実盤面" src="/cinematic-vfx-current.html"></iframe><div id="version-badge">A · 現行</div><div id="loading">現行の盤面・カードを準備しています…</div><div class="caption"><span id="eyebrow">02 / SUMMON</span><h2 id="effect-title">通常召喚・２案</h2><p id="description">マナの力でカードを具現化する。</p></div></section><footer><nav aria-label="演出の種類"><button data-kind="draw" aria-pressed="false"><em>01</em>ドロー<span>DRAW</span></button><button data-kind="summon" aria-pressed="true"><em>02</em>召喚<span>SUMMON</span></button><button data-kind="attack"><em>03</em>攻撃<span>STRIKE</span></button><button data-kind="spell"><em>04</em>魔法発動<span>CAST</span></button></nav><div class="transport"><select id="compare" aria-label="現行との比較"><option value="alternate">順番に比較</option><option value="current">現行のみ</option><option value="study" selected>試作のみ</option></select><label id="draw-label">枚数<select id="draw-count" aria-label="ドロー枚数"><option value="1">１枚</option><option value="2" selected>２枚 · ターン開始</option><option value="4">４枚 · カード効果</option></select></label><label id="summon-label">召喚<select id="summon-version" aria-label="召喚バージョン"><option value="resonance" selected>01 · 蒼光の定着</option><option value="weave">02 · マナの薄膜</option></select></label><button id="replay" title="最初から再生">↻ 再生</button><button id="pause">一時停止</button><label><input id="playlist" type="checkbox">4種を順番に</label><label><input id="loop" type="checkbox" checked>連続</label><select id="speed" aria-label="再生速度"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select><select id="mode" aria-label="表示モード"><option value="board" selected>実盤面</option><option value="focus">拡大・暗背景</option><option value="white">拡大・白背景</option></select><select id="side" aria-label="演出する陣営"><option value="0">自分側</option><option value="1">相手側</option></select><label id="spell-label" hidden>カード<select id="spell-card" aria-label="魔法カード"><option value="S4">双月の啓示</option><option value="S3">刃の囁き</option><option value="S8">リコール</option></select></label><a class="reference-link" href="https://www.youtube.com/shorts/X4TU3YKIN40" target="_blank">今回の参考映像</a><button id="sound" aria-pressed="false">試作音 OFF</button></div><div class="timeline"><span id="phase">準備中</span><input id="seek" type="range" aria-label="再生位置" min="0" max="1000" value="0"><output id="time">0.00 / 2.40s</output></div></footer></main><script type="module" src="/src/dev/cinematic-vfx/studio.ts"></script></body></html>
