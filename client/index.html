<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>LORE — 덱빌드 듀얼</title>
    <link rel="preload" as="image" href="/art/brand/lore-logo-transparent.webp" />
    <link rel="preload" as="image" href="/art/ui/loading/azure-card-v1.webp" />
    <link rel="preload" as="image" href="/art/lounge/toon-balanced-20261026/library-wide.webp" />
    <!-- ja/en typography: Shippori Mincho (ja codex serif), Noto Sans JP (ja UI), Alegreya (latin serif).
         Google Fonts serves unicode-range subsets, so unused languages cost ~nothing. -->
  </head>
  <body>
    <style>
      /* Generated from the runtime loader by Vite, before any module is needed. */
      /* LORE_LOADING_CSS */
      #startup{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
      #startup-reload{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));color:inherit;font:12px/1.6 sans-serif;letter-spacing:0;text-underline-offset:5px}
      #startup noscript{position:absolute;top:16px;font:12px sans-serif}
    </style>
    <section id="startup" class="game-loading" aria-label="LORE" role="status" aria-live="polite">
      <img class="loading-logo" src="/art/brand/lore-logo-transparent.webp" alt="LORE">
      <span id="startup-status" class="loading-title">書庫を開いています</span>
      <!-- LORE_LOADING_RITUAL -->
      <div class="loading-progress"><progress max="100" value="0" aria-label="読み込みの進捗"></progress><b>0%</b></div>
      <small id="startup-phase" class="loading-phase">準備を始めています</small>
      <a id="startup-reload" href="">読み込み直す</a>
      <noscript>JavaScript を有効にしてください / Enable JavaScript / JavaScript를 활성화해 주세요</noscript>
    </section>
    <script>
      // Runs before the first paint, including when the entry module cannot download.
      (() => {
        let language = (navigator.language || 'en').slice(0, 2);
        try { const saved = localStorage.getItem('lore_lang'); if (['ja', 'ko', 'en'].includes(saved)) language = saved; } catch {}
        if (!['ja', 'ko'].includes(language)) language = 'en';
        document.documentElement.lang = language;
        const copy = language === 'ja'
          ? ['書庫を開いています', '準備を始めています', '読み込み直す', '読み込みの進捗']
          : language === 'ko'
            ? ['서고를 여는 중', '준비 중', '다시 불러오기', '로딩 진행률']
            : ['Opening the library', 'Getting ready', 'Reload', 'Loading progress'];
        document.getElementById('startup-status').textContent = copy[0];
        document.getElementById('startup-phase').textContent = copy[1];
        document.getElementById('startup-reload').textContent = copy[2];
        document.querySelector('#startup progress').setAttribute('aria-label', copy[3]);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
