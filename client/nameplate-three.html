<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LORE ネームタグ 3案</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b24;color:#e4e2db;font:14px system-ui,sans-serif}header{position:sticky;top:0;left:0;z-index:5;background:#14212bf5;border-bottom:1px solid #53616a;padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:15px;margin:0;font-weight:500}nav{display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#22313c;border:1px solid #53616b;padding:9px 13px;cursor:pointer;border-radius:3px}button[aria-pressed=true]{border-color:#d0bc8d;background:#3b3d38;color:#f2e5c8}button:focus-visible,select:focus-visible{outline:2px solid #cfba86;outline-offset:3px}.dot{display:inline-block;width:14px;height:14px;margin-right:7px;vertical-align:-2px;border:1px solid #b29d76}.ivory{background:#e3ded2}.brass{background:#344b5e;border-width:2px}.leather{background:linear-gradient(90deg,#b29d76 15%,#172c3a 15% 85%,#b29d76 85%)}.size{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px}.note{padding:10px 18px;color:#b5c0c5;font-size:12px;position:sticky;left:0}main{overflow:auto;height:calc(100dvh - 120px);min-height:400px}iframe{display:block;width:1920px;height:1080px;border:0}body[data-size=window] iframe{width:100%;height:100%}small{color:#c8b68e}
</style></head><body><header><h1>ネームタグ / 3つの素材</h1><nav aria-label="デザイン比較"><button data-look="brass" aria-pressed="true"><i class="dot brass"></i>01 真鍮のトレイ</button><button data-look="ivory" aria-pressed="false"><i class="dot ivory"></i>02 象牙の銘板</button><button data-look="leather" aria-pressed="false"><i class="dot leather"></i>03 紺革の背表紙</button></nav><label class="size">表示サイズ<select id="size"><option value="1920">1920 × 1080・実寸</option><option value="1280">1280 × 720・実寸</option><option value="window">ウィンドウに合わせる</option></select></label></header><div class="note"><span id="description">マナ枠と同じ二重の真鍮縁。濃紺の面をそのまま上へつなぐ。</span> <small>／ 1・2・3キーでも切替。実寸表示は縮小せずスクロールできます。</small></div><main><iframe id="board" title="ネームタグの実盤面比較" src="/nameplate-study-board.html?look=brass"></iframe></main><script type="module">
const board=document.querySelector('#board');const buttons=[...document.querySelectorAll('[data-look]')];const descriptions={brass:'マナ枠と同じ二重の真鍮縁。濃紺の面をそのまま上へつなぐ。',ivory:'天板と同じ象牙色。沈んだ文字と細い真鍮線で刻印のように。',leather:'紺革に細い縫い目と真鍮の留め具。書庫の背表紙を思わせる仕立て。'};
function paint(look){if(!descriptions[look])return;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.look===look)));document.querySelector('#description').textContent=descriptions[look];const url=new URL(location.href);url.searchParams.set('look',look);history.replaceState(null,'',url);}
function select(look){paint(look);board.contentWindow.postMessage({type:'nameplate-select',look},location.origin);}
buttons.forEach(b=>b.onclick=()=>select(b.dataset.look));window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===board.contentWindow&&e.data?.type==='nameplate-look')paint(e.data.look)});
window.addEventListener('keydown',e=>{const k=['1','2','3'].indexOf(e.key);if(k>=0)select(buttons[k].dataset.look)});
const look=new URLSearchParams(location.search).get('look');if(descriptions[look]){board.src='/nameplate-study-board.html?look='+look;paint(look)}
document.querySelector('#size').onchange=e=>{const value=e.target.value;document.body.dataset.size=value;if(value!=='window'){board.style.width=(value==='1280'?1280:1920)+'px';board.style.height=(value==='1280'?720:1080)+'px'}else{board.style.removeProperty('width');board.style.removeProperty('height')}};
</script></body></html>
